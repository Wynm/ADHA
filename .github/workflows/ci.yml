name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Smoke test the built site
        run: |
          npx --yes serve dist -l 4173 >/dev/null 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:4173/ > /tmp/index.html; then break; fi
            sleep 1
          done
          kill $SERVER_PID || true
          grep -q 'ساحة الفرص' /tmp/index.html
          grep -q 'manifest' /tmp/index.html
          echo "smoke ok"
      - name: Verify build artefacts
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          echo "build ok — $(du -sh dist | cut -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
