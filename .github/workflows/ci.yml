name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Verify build artefacts
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          echo "build ok — $(du -sh dist | cut -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
