<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060a"/>
      <stop offset="0.55" stop-color="#0b0d14"/>
      <stop offset="1" stop-color="#120a06"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b1a"/>
      <stop offset="0.6" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.1" r="0.75">
      <stop offset="0" stop-color="#ff6b1a" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ff6b1a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- logo mark -->
  <g transform="translate(96,86)">
    <rect width="96" height="96" rx="24" fill="#0b0d14" stroke="#ffffff" stroke-opacity="0.14"/>
    <path d="M26 70 L48 26 L70 70 Z" fill="none" stroke="url(#g)" stroke-width="6" stroke-linejoin="round"/>
    <path d="M37 57 H59" stroke="url(#g)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="48" cy="26" r="5" fill="#a3e635"/>
  </g>
  <text x="216" y="128" font-family="Space Grotesk, Arial" font-size="46" font-weight="700" fill="#ffffff">ADHA</text>
  <text x="216" y="160" font-family="JetBrains Mono, monospace" font-size="17" fill="#64748b" letter-spacing="6">ARENA OF REAL OPS</text>

  <!-- headline -->
  <text x="96" y="300" font-family="Space Grotesk, Arial" font-size="82" font-weight="700" fill="#ffffff">ساحة الفرص</text>
  <text x="96" y="392" font-family="Space Grotesk, Arial" font-size="82" font-weight="700" fill="url(#g)">الحقيقية.</text>

  <text x="96" y="460" font-family="IBM Plex Sans Arabic, Arial" font-size="26" fill="#94a3b8">محاكي دخل ٢٤ شهراً · ماسح احتيال بعشر قواعد · خريطة ٩٠ يوماً</text>
  <text x="96" y="500" font-family="IBM Plex Sans Arabic, Arial" font-size="22" fill="#64748b">لا وعود. بل أرقام يمكنك فحصها في الكود.</text>

  <!-- right chart hint -->
  <g transform="translate(830,230)" opacity="0.95">
    <rect width="290" height="300" rx="20" fill="#0b0d14" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="22" y="34" font-family="JetBrains Mono, monospace" font-size="12" fill="#64748b" letter-spacing="2">INCOME · 24M</text>
    <path d="M22 250 C60 250 78 238 108 214 C148 182 176 160 214 140 C244 124 264 118 268 116"
          fill="none" stroke="#22d3ee" stroke-width="3"/>
    <path d="M22 250 C60 250 78 238 108 214 C148 182 176 160 214 140 C244 124 264 118 268 116 L268 264 L22 264 Z"
          fill="#22d3ee" fill-opacity="0.10"/>
    <path d="M22 262 L268 96" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 5" opacity="0.85"/>
    <text x="176" y="86" font-family="JetBrains Mono, monospace" font-size="11" fill="#ef4444">hype ≠ math</text>
    <text x="22" y="286" font-family="JetBrains Mono, monospace" font-size="11" fill="#a3e635">reality</text>
    <circle cx="268" cy="116" r="4" fill="#22d3ee"/>
  </g>

  <!-- footer bar -->
  <rect x="96" y="546" width="1008" height="1" fill="#ffffff" fill-opacity="0.10"/>
  <text x="96" y="590" font-family="JetBrains Mono, monospace" font-size="15" fill="#475569">github.com/Wynm/ADHA</text>
  <text x="1104" y="590" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="15" fill="#475569">REACT · RTL-FIRST · MIT</text>
</svg>
