<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ADHA · صفحة غير موجودة</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: radial-gradient(ellipse at 50% -10%, #2a1206 0%, #05060a 55%);
      color: #e8ecf4; font-family: "IBM Plex Sans Arabic", system-ui, sans-serif; padding: 24px;
    }
    .card { max-width: 460px; text-align: center; }
    .mark { font-family: ui-monospace, monospace; letter-spacing: .3em; font-size: 11px; color: #64748b; }
    h1 { font-size: 3rem; margin: 12px 0 8px; background: linear-gradient(100deg,#fff,#ffb37a,#22d3ee);
         -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { color: #94a3b8; line-height: 1.9; font-size: 14px; }
    a { display: inline-block; margin-top: 18px; padding: 12px 22px; border-radius: 999px;
        background: linear-gradient(100deg,#ff6b1a,#ff9a3c); color: #170a02; font-weight: 700;
        text-decoration: none; font-size: 13px; }
    .hint { margin-top: 18px; font-size: 11px; color: #475569; font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">ADHA · 404</div>
    <h1>هنا لا يوجد شيء</h1>
    <p>الصفحة التي تبحث عنها غير موجودة. وهذا في الحقيقة درس مصغّر: ليس كل رابط يستحق النقر — تحقّق قبل أن تثق.</p>
    <a href="./">عد إلى الساحة ←</a>
    <div class="hint">github.com/Wynm/ADHA</div>
  </div>
</body>
</html>
